{% extends "base.html" %}

{% block title %}{{ code }} Error — Ratnodadhi{% endblock %}

{% block content %}
  <div class="auth-box" style="text-align:center;">
    <div style="margin-bottom:12px; display:flex; justify-content:center;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--danger-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </div>
    <h2>{{ title or 'Error' }} ({{ code }})</h2>
    <p style="color:var(--text-muted); margin-top:8px;">
      {{ description or 'An unexpected error occurred.' }}
    </p>

    <div style="margin-top:20px;">
      <a href="/" class="btn btn-secondary">Return to Library</a>
    </div>
  </div>
{% endblock %}
