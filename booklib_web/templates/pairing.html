{% extends "base.html" %}

{% block title %}Device Paired — Ratnodadhi{% endblock %}

{% block content %}
  <div class="auth-box" style="text-align:center;">
    <div style="margin-bottom:16px; display:flex; justify-content:center;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
        <line x1="12" y1="18" x2="12.01" y2="18"></line>
      </svg>
    </div>
    <h2>Device Paired Successfully!</h2>
    <p style="color:var(--text-muted); font-size:0.95rem; margin-top:8px;">
      This device is now authorized to browse and download books from your library.
    </p>

    <div style="margin-top:24px;">
      <a href="/" class="btn" style="width:100%;">Go to Library</a>
    </div>
  </div>
{% endblock %}
